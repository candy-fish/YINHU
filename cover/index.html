<!DOCTYPE html>
<html lang="zh-CN" class="cover-locked">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>银壶</title>
    <link rel="stylesheet" href="/cover/login.css">
    <script src="/cover/login.js" defer></script>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="cover.css">
    <link rel="stylesheet" href="/assets/layout.css">
    <script src="/assets/asset-manifest.js"></script>
    <script type="module" src="/assets/bootstrap.js"></script>
</head>
<body class="cover-page">
    <form class="login" aria-label="进入银壶" novalidate>
        <input class="login-input" type="password" inputmode="numeric" pattern="[0-9]*"
            aria-label="输入数字密码" autocomplete="off" spellcheck="false" enterkeyhint="go" autofocus>
    </form>
    <!-- Matrix 数字雨背景 -->
    <canvas id="matrixCanvas"></canvas>
    
    <!-- 雨痕覆盖层 -->
    <canvas id="rainCanvas"></canvas>
    
    <!-- 主文字 -->
    <h1 class="metal-text" id="main-text">
        欢迎<span class="verb" id="verb">回到</span>银壶
    </h1>

    <script>
        // 登录成功后才启动封面，黑屏阶段不运行背景动画。
        window.addEventListener('blackdoor:unlocked', () => {
        document.body.addEventListener('click', () => {
            location.href = '../transition/transition.html';
        });
        // ===== Matrix 数字雨 =====
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        
        const MATRIX = {
            fontSize: 14,
            columns: 0,
            drops: [],
            chars: '202308262024070520260428202604292006070520060515112058832032021016170511011607444096013205760540003209811002061596214368618962529727',
            color: '180, 210, 200',  // 冷青绿色，呼应银壶色调
            opacity: 0.08            // 极低透明度，作为背景纹理
        };
        
        function initMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            
            MATRIX.columns = Math.floor(matrixCanvas.width / MATRIX.fontSize);
            MATRIX.drops = [];
            
            for (let i = 0; i < MATRIX.columns; i++) {
                // 随机起始高度，制造错落感
                MATRIX.drops[i] = Math.random() * -100;
            }
        }
        
        function drawMatrix() {
            // 半透明黑色覆盖，制造拖尾 fade 效果
            matrixCtx.fillStyle = `rgba(10, 10, 15, 0.05)`;
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            
            matrixCtx.font = `${MATRIX.fontSize}px "Space Grotesk", monospace`;
            
            for (let i = 0; i < MATRIX.drops.length; i++) {
                // 随机字符
                const char = MATRIX.chars[Math.floor(Math.random() * MATRIX.chars.length)];
                
                // 头部：亮
                matrixCtx.fillStyle = `rgba(${MATRIX.color}, 0.4)`;
                matrixCtx.fillText(char, i * MATRIX.fontSize, MATRIX.drops[i] * MATRIX.fontSize);
                
                // 随机重置到顶部
                if (MATRIX.drops[i] * MATRIX.fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    MATRIX.drops[i] = 0;
                }
                
                MATRIX.drops[i]++;
            }
            
            requestAnimationFrame(drawMatrix);
        }
        
        window.addEventListener('resize', initMatrix);
        initMatrix();
        drawMatrix();

        // ===== 雨痕（从下往上） =====
        const RAIN = {
            dropCount: 12,
            dropSpeed: 0.3,
            dropLength: 80,
            dropWidth: 1.5,
            opacity: 0.15,
            scanlineOpacity: 0.03
        };

        const rainCanvas = document.getElementById('rainCanvas');
        const rainCtx = rainCanvas.getContext('2d');
        let drops = [];
        let scanOffset = 0;

        function initRain() {
            rainCanvas.width = window.innerWidth;
            rainCanvas.height = window.innerHeight;
            
            for (let i = 0; i < RAIN.dropCount; i++) {
                drops.push({
                    x: Math.random() * rainCanvas.width,
                    y: Math.random() * rainCanvas.height,
                    speed: RAIN.dropSpeed + Math.random() * 0.2,
                    length: RAIN.dropLength + Math.random() * 40,
                    width: RAIN.dropWidth + Math.random() * 0.5,
                    opacity: RAIN.opacity + Math.random() * 0.1,
                    wobble: Math.random() * Math.PI * 2
                });
            }
        }

        function drawRain() {
            const w = rainCanvas.width;
            const h = rainCanvas.height;
            
            rainCtx.clearRect(0, 0, w, h);
            
            scanOffset = (scanOffset + 0.5) % 4;
            rainCtx.fillStyle = `rgba(255,255,255,${RAIN.scanlineOpacity})`;
            for (let y = scanOffset; y < h; y += 4) {
                rainCtx.fillRect(0, y, w, 1);
            }
            
            drops.forEach(drop => {
                drop.y -= drop.speed;
                drop.wobble += 0.02;
                
                if (drop.y < -drop.length) {
                    drop.y = h + drop.length;
                    drop.x = Math.random() * w;
                }
                
                const wobbleX = Math.sin(drop.wobble) * 2;
                
                const gradient = rainCtx.createLinearGradient(
                    drop.x + wobbleX, drop.y + drop.length,
                    drop.x + wobbleX, drop.y
                );
                gradient.addColorStop(0, `rgba(200,210,230,${drop.opacity})`);
                gradient.addColorStop(0.5, `rgba(200,210,230,${drop.opacity * 0.6})`);
                gradient.addColorStop(1, `rgba(200,210,230,0)`);
                
                rainCtx.strokeStyle = gradient;
                rainCtx.lineWidth = drop.width;
                rainCtx.lineCap = 'round';
                
                rainCtx.beginPath();
                rainCtx.moveTo(
                    drop.x + wobbleX + Math.sin(drop.wobble * 2) * 1,
                    drop.y + drop.length
                );
                rainCtx.lineTo(drop.x + wobbleX, drop.y);
                rainCtx.stroke();
                
                rainCtx.fillStyle = `rgba(200,210,230,${drop.opacity * 0.8})`;
                rainCtx.beginPath();
                rainCtx.arc(
                    drop.x + wobbleX + Math.sin(drop.wobble * 2) * 1,
                    drop.y + drop.length,
                    drop.width * 1.5,
                    0, Math.PI * 2
                );
                rainCtx.fill();
            });
            
            requestAnimationFrame(drawRain);
        }

        window.addEventListener('resize', () => {
            rainCanvas.width = window.innerWidth;
            rainCanvas.height = window.innerHeight;
        });

        initRain();
        drawRain();

        // ===== "回到"闪烁 =====
        const CONFIG = {
            verbNormal: '回到',
            verbGlitch: '来到',
            intervalMin: 2000,
            intervalMax: 6000,
            glitchDuration: 150
        };

        const verbEl = document.getElementById('verb');

        function verbGlitchLoop() {
            const nextDelay = Math.random() * (CONFIG.intervalMax - CONFIG.intervalMin) + CONFIG.intervalMin;
            
            setTimeout(() => {
                verbEl.textContent = CONFIG.verbGlitch;
                verbEl.classList.add('glitching');
                
                setTimeout(() => {
                    verbEl.textContent = CONFIG.verbNormal;
                    verbEl.classList.remove('glitching');
                    verbGlitchLoop();
                }, CONFIG.glitchDuration);
            }, nextDelay);
        }

        document.fonts.ready.then(() => {
            verbGlitchLoop();
        });
        }, { once: true });
    </script>
</body>
</html>
