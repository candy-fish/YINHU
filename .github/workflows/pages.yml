name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/shared-cloud.test.mjs tests/supabase-api.test.mjs tests/supabase-sql.test.mjs
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build:pages
        env:
          BLACKDOOR_BASE_PATH: /${{ github.event.repository.name }}/
          BLACKDOOR_API_BASE: ${{ vars.BLACKDOOR_API_BASE }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
