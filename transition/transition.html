    <!-- 日历弹窗逻辑 -->
    <script>
        (() => {
            const calendarContainer = document.getElementById('calendarContainer');
            let calendarLoadPromise = null;

            function showCalendar() {
                const modal = document.getElementById('calendarModal');
                if (!modal) return;

                modal.classList.add('active');

                if (typeof window.renderCalendar === 'function') {
                    window.renderCalendar();
                }
            }

            function loadCalendarScript() {
                return new Promise((resolve, reject) => {
                    const existingScript = document.querySelector('script[data-calendar-script]');

                    if (existingScript) {
                        if (existingScript.dataset.loaded === 'true') {
                            resolve();
                            return;
                        }

                        existingScript.addEventListener('load', resolve, { once: true });
                        existingScript.addEventListener('error', reject, { once: true });
                        return;
                    }

                    const script = document.createElement('script');
                    script.src = 'calendar/calendar.js';
                    script.dataset.calendarScript = '';

                    script.addEventListener('load', () => {
                        script.dataset.loaded = 'true';
                        resolve();
                    }, { once: true });

                    script.addEventListener('error', () => {
                        script.remove();
                        reject(new Error('calendar.js 加载失败'));
                    }, { once: true });

                    document.body.appendChild(script);
                });
            }

            document.addEventListener('openCalendar', async () => {
                if (document.getElementById('calendarModal')) {
                    showCalendar();
                    return;
                }

                try {
                    if (!calendarLoadPromise) {
                        calendarLoadPromise = fetch('calendar/calendar.fragment', { cache: 'no-store' })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error(`日历片段加载失败：HTTP ${response.status}`);
                                }

                                return response.text();
                            })
                            .then(html => {
                                calendarContainer.innerHTML = html;

                                if (!document.getElementById('calendarModal')) {
                                    throw new Error('日历片段内容不完整');
                                }

                                return loadCalendarScript();
                            });
                    }

                    await calendarLoadPromise;
                    showCalendar();
                } catch (error) {
                    calendarLoadPromise = null;
                    calendarContainer.innerHTML = '';
                    console.error('日历初始化失败：', error);
                }
            });
        })();
    </script>
