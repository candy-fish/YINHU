<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222e38">
  <title>法国零食从夯到拉 · 银壶</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="pariten.css">
  <script src="pariten.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="back" href="../transition.html" aria-label="返回过渡页">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="3" width="22" height="22" rx="2"/><path d="M10 14h8"/></svg>
    </a>
    <h1>法国零食从夯到拉</h1>
  </header>
  <main class="board">
    <div class="tiers">
      <section class="tier" data-rank="0" aria-label="夯">
        <div class="label" aria-hidden="true">夯</div>
        <div class="dropzone" id="tier-0" role="group" aria-label="夯">
          <button type="button" class="card" aria-label="小奶腿" style="--aspect: 636 / 479">
            <img src="assets/snack-01.jpg" width="636" height="479" alt="" draggable="false">
          </button>
          <button type="button" class="card" aria-label="鱼蛋" style="--aspect: 405 / 720">
            <img src="assets/snack-02.jpg" width="405" height="720" alt="" draggable="false">
          </button>
        </div>
      </section>
      <div class="boundary">
        <div class="dropzone" id="between-1" role="group" aria-label="顶尖偏上"></div>
      </div>
      <section class="tier" data-rank="1" aria-label="顶尖">
        <div class="label" aria-hidden="true">顶尖</div>
        <div class="dropzone" id="tier-1" role="group" aria-label="顶尖">
          <button type="button" class="card" aria-label="便宜，美丽，味道普通却动人心弦的姜汁柠檬汽水：顶尖" style="--aspect: 405 / 720">
            <img src="assets/snack-03.jpg" width="405" height="720" alt="" draggable="false">
          </button>
          <button type="button" class="card" aria-label="法国零食测评之巧克力小小学生：顶尖" style="--aspect: 720 / 405">
            <img src="assets/snack-04.jpg" width="720" height="405" alt="" draggable="false">
          </button>
        </div>
      </section>
      <div class="boundary">
        <div class="dropzone" id="between-2" role="group" aria-label="人上人偏上"></div>
      </div>
      <section class="tier" data-rank="2" aria-label="人上人">
        <div class="label" aria-hidden="true">人上人</div>
        <div class="dropzone" id="tier-2" role="group" aria-label="人上人">
          <button type="button" class="card" aria-label="柠檬味的零食，挺不错，4欧" style="--aspect: 720 / 405">
            <img src="assets/snack-05.jpg" width="720" height="405" alt="" draggable="false">
          </button>
        </div>
      </section>
      <div class="boundary">
        <div class="dropzone" id="between-3" role="group" aria-label="NPC偏上">
          <button type="button" class="card" aria-label="法国零食从夯到拉之好阿婆黄油饼：NPC偏上" style="--aspect: 720 / 405">
            <img src="assets/snack-07.jpg" width="720" height="405" alt="" draggable="false">
          </button>
        </div>
      </div>
      <section class="tier" data-rank="3" aria-label="NPC">
        <div class="label" aria-hidden="true">NPC</div>
        <div class="dropzone" id="tier-3" role="group" aria-label="NPC">
          <button type="button" class="card" aria-label="橘子味汽水但不鲜不甜，npc吧" style="--aspect: 405 / 720">
            <img src="assets/snack-06.jpg" width="405" height="720" alt="" draggable="false">
          </button>
          <button type="button" class="card" aria-label="法国饮料测评之思客卫普：npc，虽然是汽水但是我口渴时救我，略有感恩之情，口味普通，气太多了点" style="--aspect: 405 / 720">
            <img src="assets/snack-08.jpg" width="405" height="720" alt="" draggable="false">
          </button>
          <button type="button" class="card" aria-label="：蜂蜜芥末味薯片，100%法国土豆制作，只有芥末味，npc吧" style="--aspect: 405 / 720">
            <img src="assets/snack-10.jpg" width="405" height="720" alt="" draggable="false">
          </button>
        </div>
      </section>
      <div class="boundary">
        <div class="dropzone" id="between-4" role="group" aria-label="拉偏上">
          <button type="button" class="card" aria-label="皮姆，特别像好利来那个派，不是我喜欢的口感，npc向下一点吧" style="--aspect: 720 / 405">
            <img src="assets/snack-09.jpg" width="720" height="405" alt="" draggable="false">
          </button>
        </div>
      </div>
      <section class="tier" data-rank="4" aria-label="拉">
        <div class="label" aria-hidden="true">拉</div>
        <div class="dropzone" id="tier-4" role="group" aria-label="拉">
          <button type="button" class="card" aria-label="拉！拉！拉！是我非常讨厌的口感，归类为东北零食" style="--aspect: 720 / 405">
            <img src="assets/snack-11.jpg" width="720" height="405" alt="" draggable="false">
          </button>
        </div>
      </section>
    </div>
    <div class="dropzone library" id="tier-5" role="group" aria-label="待评价">
      <button type="button" class="card" aria-label="default" style="--aspect: 720 / 405">
        <img src="assets/snack-12.jpg" width="720" height="405" alt="" draggable="false">
      </button>
      <button type="button" class="card" aria-label="硬的" style="--aspect: 720 / 405">
        <img src="assets/snack-13.jpg" width="720" height="405" alt="" draggable="false">
      </button>
    </div>
  </main>
  <aside class="name-popup" role="dialog" aria-label="图名" hidden>
    <button class="close" type="button" aria-label="关闭">×</button>
    <p></p>
  </aside>
</body>
</html>
