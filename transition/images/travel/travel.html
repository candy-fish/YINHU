<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030507">
  <title>旅行地图 · 映相</title>
  <link rel="stylesheet" href="travel.css">
  <script type="module" src="../assets/travel-globe.bundle.js"></script>
</head>
<body>
  <main aria-label="旅行地图">
    <canvas id="earth" tabindex="0" role="img" aria-label="全球夜间灯光地球，可左右拖动或使用左右方向键旋转" aria-busy="true"></canvas>
    <p id="loadError" role="alert" hidden>地球加载失败，请刷新重试。</p>
    <button id="openAtlas" class="palette-entry icon-button" aria-label="打开旅行涂色地图" aria-haspopup="dialog" title="旅行涂色地图">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.4a2.1 2.1 0 0 0 1.3-3.7 1.4 1.4 0 0 1 1-2.4H18a3 3 0 0 0 3-3C21 7 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="11" cy="6.8" r="1"/><circle cx="15.8" cy="8" r="1"/><circle cx="6.8" cy="14.5" r="1"/></svg>
    </button>
    <a class="gallery-return" href="../images.html" aria-label="返回映相主页面">
      <svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect x="3" y="3" width="30" height="30"/><rect x="12" y="12" width="12" height="12"/></svg>
    </a>
  </main>
  <dialog id="travelAtlas" aria-label="旅行涂色地图">
    <button id="closeAtlas" class="gallery-return" aria-label="返回地球"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect x="3" y="3" width="30" height="30"/><rect x="12" y="12" width="12" height="12"/></svg></button>
    <section id="locationInfo" class="location-info" aria-label="地点信息" hidden><p id="locationCountry"></p><p id="locationParent" hidden></p><h2 id="regionName"></h2><p id="locationCoordinates"></p></section>
    <div id="mapViewport" class="map-viewport" tabindex="0" aria-label="全球行政区划图，可拖动平移，滚轮或双指缩放，方向键移动，加减键缩放">
      <svg id="adminMap" viewBox="0 0 1080 540" aria-label="可涂色的行政区划图"><defs id="subregionClips"></defs><g id="mapRegions"></g><g id="mapSubregions"></g><g id="mapContours" aria-hidden="true" pointer-events="none"></g></svg>
    </div>
    <div class="atlas-footer"><p id="mapStatus" role="status" aria-live="polite">正在载入地图…</p></div>
    <section class="color-display" aria-label="当前颜色">
      <div id="colorPreview" aria-hidden="true"></div>
      <div class="color-code"><input id="colorHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="十六进制颜色"><button id="eraseColor" class="erase-color" type="button" aria-label="清除颜色" aria-pressed="false" title="清除颜色"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 14 8-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 9H9l-5-5a2 2 0 0 1 0-2Z M8 9l8 8M12 21h9"/></svg></button></div>
    </section>
    <div id="paintPalette" class="paint-palette" role="group" aria-label="主色与灰度">
      <div class="color-strip gray-strip"><div id="grayBlocks" class="strip-blocks" aria-hidden="true"></div><div class="strip-gradient" aria-hidden="true"></div><input id="colorGray" type="range" min="0" max="100" step="0.1" aria-label="灰度与明暗" disabled></div>
      <div class="color-strip saturation-strip"><div id="saturationBlocks" class="strip-blocks" aria-hidden="true"></div><div class="strip-gradient" aria-hidden="true"></div><input id="colorSaturation" type="range" min="0" max="100" step="0.1" aria-label="饱和度" disabled></div>
      <div class="color-strip hue-strip"><div id="hueBlocks" class="strip-blocks" aria-hidden="true"></div><div class="strip-gradient" aria-hidden="true"></div><input id="colorHue" type="range" min="0" max="360" step="0.1" aria-label="主色" disabled></div>
    </div>
    <button id="drawMap" class="draw-button" aria-label="绘制" title="绘制" aria-pressed="false" aria-controls="paintPalette"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 4 6 6M5 15 17 3a2.8 2.8 0 0 1 4 4L9 19l-6 2 2-6Z"/></svg></button>
    <div class="map-zoom" role="group" aria-label="地图缩放"><button id="zoomIn" aria-label="放大地图">＋</button><button id="zoomOut" aria-label="缩小地图">−</button><button id="resetMap" aria-label="显示完整地图" title="显示完整地图">⌖</button></div>
    <a class="map-data-credit" href="map-sources.html" target="_blank" rel="noopener">地图数据 · geoBoundaries / CTAmap</a>
  </dialog>
</body>
</html>
